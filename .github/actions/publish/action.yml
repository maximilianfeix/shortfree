name: publish
description: Export public data, upload a dated snapshot and the rolling assets to the data release, commit data/ and upload the Pages artifact.
inputs:
  message:
    description: Commit message prefix
    default: "data: scan"
runs:
  using: composite
  steps:
    - name: Export
      shell: bash
      run: ./shortfree export

    - name: Upload a dated snapshot and the rolling assets to the data release
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        mkdir -p release snapshot-src
        for f in dist/4/*.txt; do t=$(basename "$f" .txt); gzip -9c "$f" > "release/four-$t.txt.gz"; done
        for f in data/txt/*.txt; do
          t=$(basename "$f")
          cp "$f" "release/verified-$t"
          cp "$f" "release/short-$t" # old name, kept for existing consumers
        done
        for f in dist/api/v1/*.csv; do
          t=$(basename "$f" .csv)
          if [ "$t" = free ]; then cp "$f" release/short-all.csv; else cp "$f" "release/short-$t.csv"; fi
        done
        cp data/changes.json data/coverage.json release/

        # The snapshot is one immutable archive per run: lists, CSVs,
        # bitmaps with shard coverage, stats and coverage. 4 character text
        # lists are left out (the bitmaps hold the same data, much smaller).
        cp release/verified-*.txt release/short-*.csv release/changes.json snapshot-src/
        cp data/stats.json data/coverage.json data/available.json snapshot-src/
        cp bitmaps/*.bin snapshot-src/
        covs=(bitmaps/*.cov.json)
        if ((${#covs[@]})); then cp "${covs[@]}" snapshot-src/; fi
        gh release view data >/dev/null 2>&1 || gh release create data --target "$GITHUB_SHA" --title "Latest data" --notes "Rolling data release, replaced daily." --latest=false
        assets=$(gh release view data --json assets -q '.assets[].name')
        name="snapshot-$(jq -r '.updated[:10]' data/stats.json)"
        # Never overwrite a published snapshot: a rerun on the same day gets
        # its own name.
        if grep -qx "$name.tar.gz" <<<"$assets"; then name="$name-${GITHUB_RUN_ID}x${GITHUB_RUN_ATTEMPT}"; fi
        ./shortfree snapshot -in snapshot-src -name "$name" -out snapshot

        # Order matters: the immutable snapshot first, the rolling assets
        # next, manifest.json (the pointer consumers read first) last.
        gh release upload data "snapshot/$name.tar.gz"
        gh release upload data state/state.json.gz bitmaps/*.bin release/* --clobber
        if ((${#covs[@]})); then gh release upload data "${covs[@]}" --clobber; fi
        gh release upload data snapshot/manifest.json --clobber

        # Keep the newest 30 snapshots.
        gh release view data --json assets -q '.assets[].name' | grep -E '^snapshot-.*\.tar\.gz$' | sort | head -n -30 |
          while read -r old; do gh release delete-asset data "$old" -y; done

        gh release edit data --notes "$(printf 'Rolling data release, updated daily by the scan workflow.\n\nLast scan: %s\n\n- `manifest.json`: points to the newest snapshot (name, SHA-256, file list, counts, coverage). Read it first.\n- `snapshot-YYYY-MM-DD.tar.gz`: immutable archive of one run (the newest 30 are kept): verified lists, CSVs, bitmaps with shard coverage, stats.json, coverage.json\n- `verified-<tld>.txt`: 1–3 character domains with current RDAP evidence of not being registered (`short-<tld>.txt` is the same file under its old name)\n- `short-<tld>.csv`: 1–3 character names with status, verification (rdap_verified, stale, pending) and evidence age\n- `short-all.csv`: every RDAP-verified 1–3 character domain on all TLDs (same columns)\n- `changes.json`: domains freed (RDAP registered/dropping to 404), newly listed or taken in the last 30 days\n- `coverage.json`: what the data is based on (sweeps, unknowns, unscanned shards, evidence age)\n- `four-<tld>.txt.gz`: 4 character names not in the zone (DNS check only)\n- `<tld>.bin`, `<tld>.cov.json`: 4 character bitmap (1 bit per base-37 index) and which shards were swept\n- `state.json.gz`: scanner state\n\nNot registered does not mean registrable: see docs/accuracy.md.' "$(date -u '+%Y-%m-%d %H:%M UTC')")"

    - name: Commit public data
      shell: bash
      env:
        MESSAGE: ${{ inputs.message }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data README.md
        if git diff --cached --quiet; then echo "no changes"; exit 0; fi
        git commit -m "$MESSAGE $(date -u +%Y-%m-%d)"
        git pull --rebase origin main
        git push origin HEAD:main

    - name: Assemble site
      shell: bash
      run: |
        mkdir -p _site/data/4
        cp -r site/. _site/
        cp brand/mark.svg brand/favicon.svg brand/social-preview.png _site/
        cp data/*.json _site/data/
        cp -r data/txt _site/data/
        cp bitmaps/*.bin _site/data/4/
        cp -r dist/api _site/api
        cp docs/openapi.yaml _site/api/
        ./shortfree pages -data data -bitmaps bitmaps -out _site
        touch _site/.nojekyll

    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v5
      with:
        path: _site

name: publish
description: Export public data, upload the rolling assets (and, when final, a dated snapshot) to the data release, commit data/ (when final) and upload the Pages artifact.
inputs:
  message:
    description: Commit message prefix
    default: "data: scan"
  final:
    description: "true: also write the dated snapshot and manifest.json and commit data/. false: an incremental publish while the scan is still running (rolling assets and site only)."
    default: "true"
  base:
    description: Directory with the bitmaps the data release holds now; bitmaps that did not change are not uploaded again (empty = upload all)
    default: ""
runs:
  using: composite
  steps:
    - name: Export
      shell: bash
      run: ./shortfree export

    - name: Upload the rolling assets (and when final a dated snapshot) to the data release
      shell: bash
      env:
        FINAL: ${{ inputs.final }}
        BASE: ${{ inputs.base }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        mkdir -p release snapshot-src
        # Bitmaps (and their 4 character lists) only where they changed:
        # scan jobs still starting read their own TLD's bitmap while this
        # runs, and an upload with --clobber briefly removes the old asset.
        # Early partial publishes may have no 4 character bitmaps yet.
        shopt -s nullglob
        mkdir -p bitmaps
        bins=() covs=()
        for f in bitmaps/*.bin; do
          t=$(basename "$f" .bin)
          c="bitmaps/$t.cov.json"
          if [ -f "$c" ] && { [ -z "$BASE" ] || ! cmp -s "$c" "$BASE/$t.cov.json"; }; then covs+=("$c"); fi
          if [ -n "$BASE" ] && cmp -s "$f" "$BASE/$t.bin"; then continue; fi
          bins+=("$f")
          if [ -f "dist/4/$t.txt" ]; then gzip -9c "dist/4/$t.txt" > "release/four-$t.txt.gz"; fi
        done
        for f in data/txt/*.txt; do
          t=$(basename "$f")
          cp "$f" "release/verified-$t"
          cp "$f" "release/short-$t" # old name, kept for existing consumers
        done
        for f in dist/api/v1/*.csv; do
          t=$(basename "$f" .csv)
          if [ "$t" = free ]; then cp "$f" release/short-all.csv; else cp "$f" "release/short-$t.csv"; fi
        done
        cp data/changes.json data/coverage.json release/
        gh release view data >/dev/null 2>&1 || gh release create data --target "$GITHUB_SHA" --title "Latest data" --notes "Rolling data release, replaced daily." --latest=false

        if [ "$FINAL" = true ]; then
          # The snapshot is one immutable archive per run: lists, CSVs,
          # bitmaps with shard coverage, stats and coverage. 4 character text
          # lists are left out (the bitmaps hold the same data, much smaller).
          cp release/verified-*.txt release/short-*.csv release/changes.json snapshot-src/
          cp data/stats.json data/coverage.json data/available.json snapshot-src/
          allbins=(bitmaps/*.bin)
          if ((${#allbins[@]})); then cp "${allbins[@]}" snapshot-src/; fi
          allcovs=(bitmaps/*.cov.json)
          if ((${#allcovs[@]})); then cp "${allcovs[@]}" snapshot-src/; fi
          assets=$(gh release view data --json assets -q '.assets[].name')
          name="snapshot-$(jq -r '.updated[:10]' data/stats.json)"
          # Never overwrite a published snapshot: a rerun on the same day gets
          # its own name.
          if grep -qx "$name.tar.gz" <<<"$assets"; then name="$name-${GITHUB_RUN_ID}x${GITHUB_RUN_ATTEMPT}"; fi
          ./shortfree snapshot -in snapshot-src -name "$name" -out snapshot
          # The immutable snapshot goes up before the rolling assets.
          gh release upload data "snapshot/$name.tar.gz"
        fi

        # state.json.gz on its own (scan jobs retry while it is missing), then
        # bitmaps with coverage, then the lists; manifest.json (the pointer
        # consumers read first) last.
        gh release upload data state/state.json.gz --clobber
        if ((${#bins[@]})); then gh release upload data "${bins[@]}" --clobber; fi
        if ((${#covs[@]})); then gh release upload data "${covs[@]}" --clobber; fi
        # GitHub rejects empty uploads (a TLD with no free names yields an
        # empty list): upload the non-empty files, delete stale copies of the
        # empty ones so no outdated list stays behind.
        nonempty=() existing=$(gh release view data --json assets -q '.assets[].name')
        for f in release/*; do
          if [ -s "$f" ]; then nonempty+=("$f")
          elif grep -qx "$(basename "$f")" <<<"$existing"; then gh release delete-asset data "$(basename "$f")" -y; fi
        done
        if ((${#nonempty[@]})); then gh release upload data "${nonempty[@]}" --clobber; fi

        if [ "$FINAL" = true ]; then
          gh release upload data snapshot/manifest.json --clobber
          # Keep the newest 30 snapshots.
          gh release view data --json assets -q '.assets[].name' | grep -E '^snapshot-.*\.tar\.gz$' | sort | head -n -30 |
            while read -r old; do gh release delete-asset data "$old" -y; done
        fi

        gh release edit data --notes "$(printf 'Rolling data release, updated by the scan workflow as each TLD finishes.\n\nLast update: %s\n\n- `manifest.json`: points to the newest snapshot (name, SHA-256, file list, counts, coverage). Read it first.\n- `snapshot-YYYY-MM-DD.tar.gz`: immutable archive of one complete daily run (the newest 30 are kept): verified lists, CSVs, bitmaps with shard coverage, stats.json, coverage.json\n- `verified-<tld>.txt`: 1–3 character domains with current RDAP evidence of not being registered (`short-<tld>.txt` is the same file under its old name)\n- `short-<tld>.csv`: 1–3 character names with status, verification (rdap_verified, stale, pending) and evidence age\n- `short-all.csv`: every RDAP-verified 1–3 character domain on all TLDs (same columns)\n- `changes.json`: domains freed (RDAP registered/dropping to 404), newly listed or taken in the last 30 days\n- `coverage.json`: what the data is based on (sweeps, unknowns, unscanned shards, evidence age)\n- `four-<tld>.txt.gz`: 4 character names not in the zone (DNS check only)\n- `<tld>.bin`, `<tld>.cov.json`: 4 character bitmap (1 bit per base-37 index) and which shards were swept\n- `state.json.gz`: scanner state\n- `part-<tld>.tar.gz`: output of a scan job that is not yet in a snapshot (internal, removed after the daily run)\n\nThe rolling assets include each TLD as soon as its job is done; the snapshot is written once all jobs are done.\n\nNot registered does not mean registrable: see docs/accuracy.md.' "$(date -u '+%Y-%m-%d %H:%M UTC')")"

    - name: Commit public data
      if: ${{ inputs.final == 'true' }}
      shell: bash
      env:
        MESSAGE: ${{ inputs.message }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data README.md
        if git diff --cached --quiet; then echo "no changes"; exit 0; fi
        git commit -m "$MESSAGE $(date -u +%Y-%m-%d)"
        git pull --rebase origin main
        git push origin HEAD:main

    - name: Assemble site
      shell: bash
      run: |
        mkdir -p _site/data/4
        cp -r site/. _site/
        cp brand/mark.svg brand/favicon.svg brand/social-preview.png _site/
        cp data/*.json _site/data/
        cp -r data/txt _site/data/
        cp bitmaps/*.bin _site/data/4/ 2>/dev/null || true
        cp -r dist/api _site/api
        cp docs/openapi.yaml _site/api/
        ./shortfree pages -data data -bitmaps bitmaps -out _site
        touch _site/.nojekyll

    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v5
      with:
        path: _site

name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "README.md"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: Smoke test against live registries
        run: |
          go run ./cmd/shortfree check google.com zqxv93kq7plm.com | tee out.txt
          grep -q "google.com.*taken" out.txt
          grep -q "zqxv93kq7plm.com.*not registered (RDAP 404)" out.txt
      - name: Front end syntax
        run: node --check site/app.js

  # Runs action.yml from this checkout against the live registries.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: name
        name: Random name nobody has registered
        run: echo "free=sf-ci-$(openssl rand -hex 8).com" >> "$GITHUB_OUTPUT"
      - id: watch
        uses: ./
        with:
          domains: |
            google.com
            ${{ steps.name.outputs.free }}
      - name: Outputs are as expected
        env:
          FREE: ${{ steps.watch.outputs.free }}
          TAKEN: ${{ steps.watch.outputs.taken }}
          RESULTS: ${{ steps.watch.outputs.results }}
          NAME: ${{ steps.name.outputs.free }}
        run: |
          echo "free=$FREE taken=$TAKEN"
          jq -e --arg n "$NAME" '. == [$n]' <<< "$FREE"
          jq -e '. == ["google.com"]' <<< "$TAKEN"
          jq -e --arg n "$NAME" 'length == 2 and .[0].verdict == "taken" and .[0].registration == "registered" and .[1].domain == $n and .[1].registration == "not_registered" and .[1].registrable == "unconfirmed" and .[1].free' <<< "$RESULTS"
      - id: fail
        uses: ./
        continue-on-error: true
        with:
          domains: ${{ steps.name.outputs.free }}
          fail-when: free
      - name: fail-when free fails the step
        run: test "${{ steps.fail.outcome }}" = failure

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creates the GitHub release with binaries and checksums.txt
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # goreleaser builds the changelog from the history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The official MCP registry (registry.modelcontextprotocol.io) only points to the
  # OCI image that docker.yml pushes for the same tag; it checks the image's
  # io.modelcontextprotocol.server.name label to see that the image is ours.
  mcp-registry:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # login with this repository's identity, no token needed
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Take the version from the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.version = $v | .packages[0].identifier = "ghcr.io/maximilianfeix/shortfree:" + $v' server.json > server.tmp && mv server.tmp server.json
          cat server.json
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for docker.yml to push the image
        timeout-minutes: 30
        run: |
          image="ghcr.io/maximilianfeix/shortfree:${GITHUB_REF_NAME#v}"
          until docker manifest inspect "$image" > /dev/null 2>&1; do
            echo "waiting for $image"; sleep 30
          done
      - name: Install mcp-publisher
        # pinned: a newer publisher may want a newer server.json schema – update both together. The sha256 is the
        # one from that release's registry_1.8.1_checksums.txt: this job holds an OIDC token, so nothing unchecked runs
        run: |
          curl -sSfL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - name: Publish
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            sleep 30
          done
          exit 1

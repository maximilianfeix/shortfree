name: scan

# Daily sweep, one runner per TLD. Each job restores the state from the
# "data" release, sweeps its TLD's 1-3 character names (DNS + RDAP) and
# today's 4 character shard. Results go out as soon as they exist: after each
# of the two steps the job uploads its own TLD as part-<tld>.tar.gz to the
# data release and dispatches pages.yml, which merges every part into the
# published data and deploys the site, one run at a time. Each TLD is taken
# wholesale from the job that scanned it (names that became taken disappear);
# TLDs whose job failed keep yesterday's data. When every job is done, the
# publish job dispatches pages.yml once more: that run also commits data/,
# writes the dated snapshot and removes the parts (see pages.yml).
#
# The TLD list comes from "shortfree tlds -json" (internal/tlds). A new TLD
# bootstraps itself: its first run gets a long RDAP budget, and its 4
# character bitmap fills one shard per day.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "4 character shard to scan (0-6, all = every shard for a full refresh, empty = today's)"
        required: false
      rdap_time:
        description: "RDAP time budget per TLD"
        required: false
        default: "90m"

permissions:
  contents: write # parts in the data release
  actions: write # dispatch pages.yml

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tlds: ${{ steps.plan.outputs.tlds }}
      shard: ${{ steps.plan.outputs.shard }}
      rdap_time: ${{ steps.plan.outputs.rdap_time }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - id: plan
        env:
          SHARD: ${{ inputs.shard }}
          RDAP_TIME: ${{ inputs.rdap_time || '90m' }}
        run: |
          # One shard for every job, even if a job starts after midnight.
          case "$SHARD" in
            "") SHARD=$(( 10#$(date -u +%j) % 7 )) ;;
            [0-6]|all) ;;
            *) echo "invalid shard: $SHARD"; exit 1 ;;
          esac
          [[ "$RDAP_TIME" =~ ^[0-9]+[hm]$ ]] || { echo "invalid rdap_time: $RDAP_TIME"; exit 1; }
          {
            echo "tlds=$(go run ./cmd/shortfree tlds -json)"
            echo "shard=$SHARD"
            echo "rdap_time=$RDAP_TIME"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  scan:
    needs: plan
    runs-on: ubuntu-latest
    # A new TLD's first run: DNS sweep + 270 min RDAP + one 4 character shard.
    # The 4 character sweep stops at SCAN4_STOP_MIN after the job start, so
    # the job finishes and uploads well before this timeout.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        tld: ${{ fromJSON(needs.plan.outputs.tlds) }}
    env:
      GH_TOKEN: ${{ github.token }}
      TLD: ${{ matrix.tld }}
      SCAN4_STOP_MIN: 300
    steps:
      - name: Note the job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o shortfree ./cmd/shortfree

      - name: Restore state from the data release
        run: |
          mkdir -p state bitmaps
          # pages.yml may be replacing state.json.gz right now (it publishes
          # the TLDs that are already done), and an upload with --clobber
          # removes the old asset first. Once a snapshot exists,
          # state.json.gz must exist too, so its absence means "look again".
          for try in 1 2 3 4 5 6; do
            # Only a missing release means "first run". Any other failure
            # must stop the job, or its output would replace good state.
            if ! out=$(gh release view data --json assets -q '.assets[].name' 2>&1); then
              if grep -qi "not found" <<<"$out"; then
                echo "no data release yet, starting from scratch"; break
              fi
              echo "$out"; exit 1
            fi
            if grep -qx 'state.json.gz' <<<"$out"; then
              gh release download data -p 'state.json.gz' -D state --clobber ||
                { sleep 30; gh release download data -p 'state.json.gz' -D state --clobber; }
              # A TLD added recently has no bitmap yet; scan4 starts empty.
              # pages.yml only rewrites the bitmap of a TLD whose job has
              # uploaded a part, so this listing is current for this TLD.
              if grep -qx "$TLD.bin" <<<"$out"; then
                gh release download data -p "$TLD.bin" -D bitmaps --clobber
              fi
              # Shard coverage of the bitmap (missing in releases made before
              # coverage was recorded: every shard then counts as unscanned).
              if grep -qx "$TLD.cov.json" <<<"$out"; then
                gh release download data -p "$TLD.cov.json" -D bitmaps --clobber
              fi
              break
            fi
            if ! grep -q '^snapshot-.*\.tar\.gz$' <<<"$out"; then
              echo "nothing published yet (first run), starting from scratch"; break
            fi
            if [ "$try" = 6 ]; then echo "state.json.gz missing from the data release"; exit 1; fi
            echo "state.json.gz is being replaced, looking again"; sleep 30
          done
          ls -la state bitmaps

      - name: Sweep 1-3 characters and verify via RDAP
        id: scan13
        env:
          RDAP_TIME: ${{ needs.plan.outputs.rdap_time }}
          SHARD: ${{ needs.plan.outputs.shard }}
        run: |
          # A full 4 character refresh needs ~80 min of DNS time, so new TLDs
          # get the normal RDAP budget instead of the long first-run one.
          NEW=270m; [ "$SHARD" = all ] && NEW="$RDAP_TIME"
          ./shortfree scan -tlds "$TLD" -rdap-time "$RDAP_TIME" -rdap-time-new "$NEW" -keep-only

      # Publish the 1-3 character results now instead of waiting for the
      # slowest 4 character sweep of all TLDs. state.json.gz holds only this
      # TLD (-keep-only); the bitmap is still the restored one.
      - name: Publish 1-3 characters
        uses: ./.github/actions/upload-part
        with:
          tld: ${{ matrix.tld }}

      - name: Sweep 4 character shard(s)
        env:
          SHARD: ${{ needs.plan.outputs.shard }}
        run: |
          # Slow name servers can make a shard take hours. Each scan4 run
          # gets the time left until SCAN4_STOP_MIN after the job start; a
          # shard cut off by it is saved but not recorded as swept (coverage
          # keeps its previous state), and remaining shards are skipped.
          # timeout is only a backstop: SIGINT also saves the answers so far.
          stop=$(( JOB_START + SCAN4_STOP_MIN * 60 ))
          shards="$SHARD"; [ "$SHARD" = all ] && shards="0 1 2 3 4 5 6"
          status=0
          for s in $shards; do
            left=$(( stop - $(date +%s) ))
            if [ "$left" -lt 60 ]; then
              echo "::warning title=scan4 .$TLD::time budget used up, shard(s) from $s on not swept this run (coverage keeps their previous state)"
              break
            fi
            timeout -s INT -k 60 $(( left + 120 )) ./shortfree scan4 -tlds "$TLD" -shard "$s" -time "${left}s" || status=$?
          done
          exit "$status"

      # Publish again whenever the 1-3 character step succeeded, even if the
      # 4 character step failed: the state is complete on its own, and the
      # bitmap's coverage file says which shards were swept. Without a
      # successful 1-3 step, state.json.gz is still the full downloaded state
      # and must not be uploaded as this TLD's output.
      - name: Publish 4 characters
        if: ${{ always() && steps.scan13.outcome == 'success' }}
        uses: ./.github/actions/upload-part
        with:
          tld: ${{ matrix.tld }}

  publish:
    needs: scan
    # Every job has published its own TLD already. This dispatch makes sure
    # a pages.yml run starts after all jobs are done: that run is the final
    # one (commit, snapshot, parts removed). Also after failures or a
    # cancel, so finished TLDs do not wait as parts for the next scan.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch the final publish
        run: gh workflow run pages.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

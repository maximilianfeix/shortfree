name: scan

# Daily sweep. State (RDAP cache, 4 character bitmaps) lives in the assets of
# the "data" release so the git history only carries the small public lists.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "4 character shard to scan (0-6, empty = today's)"
        required: false
      rdap_time:
        description: "RDAP time budget per registry"
        required: false
        default: "60m"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o shortfree ./cmd/shortfree

      - name: Restore state from the data release
        run: |
          mkdir -p state bitmaps
          # Only a missing release means "first run". Any other failure must
          # stop the job, or the upload below would overwrite good state.
          if out=$(gh release view data 2>&1); then
            gh release download data -p 'state.json.gz' -D state
            gh release download data -p '*.bin' -D bitmaps
          elif grep -qi "not found" <<<"$out"; then
            echo "no data release yet, starting from scratch"
          else
            echo "$out"; exit 1
          fi
          ls -la state bitmaps

      - name: Sweep 4 character shard
        env:
          SHARD: ${{ inputs.shard }}
        run: |
          case "$SHARD" in
            "") ./shortfree scan4 ;;
            [0-6]) ./shortfree scan4 -shard "$SHARD" ;;
            *) echo "invalid shard: $SHARD"; exit 1 ;;
          esac

      - name: Sweep 1-3 characters and verify via RDAP
        env:
          RDAP_TIME: ${{ inputs.rdap_time || '60m' }}
        run: |
          [[ "$RDAP_TIME" =~ ^[0-9]+[hm]$ ]] || { echo "invalid rdap_time: $RDAP_TIME"; exit 1; }
          ./shortfree scan -rdap-time "$RDAP_TIME"

      - uses: ./.github/actions/publish

      - id: deploy
        uses: actions/deploy-pages@v5

name: scan

# Daily sweep, one runner per TLD. Each job restores the state from the
# "data" release, sweeps its TLD's 1-3 character names (DNS + RDAP) and
# today's 4 character shard, and uploads only its own TLD. The publish job
# takes every TLD wholesale from the job that scanned it (names that became
# taken disappear); TLDs whose job failed keep yesterday's data.
#
# The TLD list comes from "shortfree tlds -json" (internal/tlds). A new TLD
# bootstraps itself: its first run gets a long RDAP budget, and its 4
# character bitmap fills one shard per day.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "4 character shard to scan (0-6, all = every shard for a full refresh, empty = today's)"
        required: false
      rdap_time:
        description: "RDAP time budget per TLD"
        required: false
        default: "90m"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tlds: ${{ steps.plan.outputs.tlds }}
      shard: ${{ steps.plan.outputs.shard }}
      rdap_time: ${{ steps.plan.outputs.rdap_time }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - id: plan
        env:
          SHARD: ${{ inputs.shard }}
          RDAP_TIME: ${{ inputs.rdap_time || '90m' }}
        run: |
          # One shard for every job, even if a job starts after midnight.
          case "$SHARD" in
            "") SHARD=$(( 10#$(date -u +%j) % 7 )) ;;
            [0-6]|all) ;;
            *) echo "invalid shard: $SHARD"; exit 1 ;;
          esac
          [[ "$RDAP_TIME" =~ ^[0-9]+[hm]$ ]] || { echo "invalid rdap_time: $RDAP_TIME"; exit 1; }
          {
            echo "tlds=$(go run ./cmd/shortfree tlds -json)"
            echo "shard=$SHARD"
            echo "rdap_time=$RDAP_TIME"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  scan:
    needs: plan
    runs-on: ubuntu-latest
    # A new TLD's first run: DNS sweep + 270 min RDAP + one 4 character shard.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        tld: ${{ fromJSON(needs.plan.outputs.tlds) }}
    env:
      GH_TOKEN: ${{ github.token }}
      TLD: ${{ matrix.tld }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o shortfree ./cmd/shortfree

      - name: Restore state from the data release
        run: |
          mkdir -p state bitmaps
          # Only a missing release means "first run". Any other failure must
          # stop the job, or its output would replace good state.
          if out=$(gh release view data --json assets -q '.assets[].name' 2>&1); then
            gh release download data -p 'state.json.gz' -D state
            # A TLD added recently has no bitmap yet; scan4 starts empty.
            if grep -qx "$TLD.bin" <<<"$out"; then
              gh release download data -p "$TLD.bin" -D bitmaps
            fi
            # Shard coverage of the bitmap (missing in releases made before
            # coverage was recorded: every shard then counts as unscanned).
            if grep -qx "$TLD.cov.json" <<<"$out"; then
              gh release download data -p "$TLD.cov.json" -D bitmaps
            fi
          elif grep -qi "not found" <<<"$out"; then
            echo "no data release yet, starting from scratch"
          else
            echo "$out"; exit 1
          fi
          ls -la state bitmaps

      - name: Sweep 1-3 characters and verify via RDAP
        env:
          RDAP_TIME: ${{ needs.plan.outputs.rdap_time }}
          SHARD: ${{ needs.plan.outputs.shard }}
        run: |
          # A full 4 character refresh needs ~80 min of DNS time, so new TLDs
          # get the normal RDAP budget instead of the long first-run one.
          NEW=270m; [ "$SHARD" = all ] && NEW="$RDAP_TIME"
          ./shortfree scan -tlds "$TLD" -rdap-time "$RDAP_TIME" -rdap-time-new "$NEW" -keep-only

      - name: Sweep 4 character shard(s)
        env:
          SHARD: ${{ needs.plan.outputs.shard }}
        run: |
          if [ "$SHARD" = all ]; then
            for s in 0 1 2 3 4 5 6; do ./shortfree scan4 -tlds "$TLD" -shard "$s"; done
          else
            ./shortfree scan4 -tlds "$TLD" -shard "$SHARD"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tld-${{ matrix.tld }}
          path: |
            state/state.json.gz
            bitmaps/${{ matrix.tld }}.bin
            bitmaps/${{ matrix.tld }}.cov.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: scan
    # Publish whatever succeeded; failed TLDs keep yesterday's data (marked
    # "stale" in coverage.json), and a TLD that never had data is left out
    # instead of being published with 0 free names.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o shortfree ./cmd/shortfree

      - name: Restore previous data
        run: |
          mkdir -p prev/state prev/bitmaps
          if out=$(gh release view data --json assets -q '.assets[].name' 2>&1); then
            gh release download data -p 'state.json.gz' -D prev/state
            gh release download data -p '*.bin' -D prev/bitmaps
            if grep -q '\.cov\.json$' <<<"$out"; then
              gh release download data -p '*.cov.json' -D prev/bitmaps
            fi
          elif grep -qi "not found" <<<"$out"; then
            echo "no data release yet, starting from scratch"
          else
            echo "$out"; exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: tld-*

      - name: Merge job outputs
        run: |
          ls parts >/dev/null 2>&1 && [ -n "$(ls parts)" ] || { echo "no scan job succeeded"; exit 1; }
          # Each part holds state/state.json.gz (its TLD only) and
          # bitmaps/<tld>.bin + .cov.json; merge replaces those TLDs in prev/
          # unless the new counts jump implausibly (then prev is kept and
          # the TLD is marked "held").
          ./shortfree merge -base prev parts/*
          ls -la state bitmaps

      - uses: ./.github/actions/publish

      - id: deploy
        uses: actions/deploy-pages@v5

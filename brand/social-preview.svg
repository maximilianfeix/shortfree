<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">shortfree — Free 1–4 character domains. Rescanned daily.</title>
  <desc id="desc">Open-source domain discovery using DNS and RDAP. Illustrative status chips: q7.tools, x4k.app, and zv-9.dev, each labeled free.</desc>
  <rect width="1280" height="640" fill="#0C1426"/>
  <g transform="translate(72 72) scale(.25)">
    <rect width="512" height="512" rx="96" fill="#315BEE"/>
    <path d="M128 288h80v80h-80zM256 112h128v288H256v-48h80V160h-80z" fill="#FFFFFF"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <text x="236" y="166" fill="#F3F6FC" font-size="80" font-weight="700" letter-spacing="-4">shortfree</text>
    <text x="72" y="332" fill="#A4B2C8" font-size="20">DNS + RDAP / open source</text>
    <g fill="#152139" stroke="#637590">
      <rect x="72" y="366" width="352" height="84" rx="12"/>
      <rect x="448" y="366" width="352" height="84" rx="12"/>
      <rect x="824" y="366" width="384" height="84" rx="12"/>
    </g>
    <g fill="#F3F6FC" font-size="25">
      <text x="96" y="417">q7.tools</text>
      <text x="472" y="417">x4k.app</text>
      <text x="848" y="417">zv-9.dev</text>
    </g>
    <g fill="#69E0AA" font-size="20">
      <circle cx="335" cy="408" r="4"/>
      <text x="348" y="415">free</text>
      <circle cx="711" cy="408" r="4"/>
      <text x="724" y="415">free</text>
      <circle cx="1119" cy="408" r="4"/>
      <text x="1132" y="415">free</text>
    </g>
    <text x="72" y="490" fill="#A4B2C8" font-size="16">Illustrative domains / availability changes</text>
    <text x="72" y="572" fill="#91ACFF" font-size="22">.com .net .de .ai .io .dev .app .tools</text>
  </g>
  <text x="72" y="268" fill="#F3F6FC" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36">Free 1–4 character domains. Rescanned daily.</text>
</svg>
